openapi: 3.0.0
info:
  title: SWAPI Movies API
  version: 1.0.0
paths:
  /movies:
    get:
      summary: Get all movies
      responses:
        '200':
          description: A list of movies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Movie'
        '500':
          description: Failed to fetch movies
    post:
      summary: Create a new movie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovieInput'
      responses:
        '201':
          description: Movie created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '400':
          description: Invalid input
        '500':
          description: Failed to create movie
  /movies/{id}:
    get:
      summary: Get a movie by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The movie ID
      responses:
        '200':
          description: A movie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '400':
          description: Invalid ID supplied
        '404':
          description: Movie not found
        '500':
          description: Failed to fetch movie
    put:
      summary: Update a movie by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The movie ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovieInput'
      responses:
        '200':
          description: Movie updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '400':
          description: Invalid input
        '404':
          description: Movie not found
        '500':
          description: Failed to update movie
    delete:
      summary: Delete a movie by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The movie ID
      responses:
        '204':
          description: Movie deleted
        '400':
          description: Invalid ID supplied
        '404':
          description: Movie not found
        '500':
          description: Failed to delete movie
components:
  schemas:
    Movie:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        episode_id:
          type: integer
        opening_crawl:
          type: string
        director:
          type: string
        producer:
          type: string
        release_date:
          type: string
          format: date
    MovieInput:
      type: object
      properties:
        title:
          type: string
        episode_id:
          type: integer
        opening_crawl:
          type: string
        director:
          type: string
        producer:
          type: string
        release_date:
          type: string
          format: date
      required:
        - title
        - episode_id
        - director
        - producer
        - release_date
